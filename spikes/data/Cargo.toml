# The store both desktop spikes read (docs/spikes/2026-11-11-rune-desktop.md and its GPUI twin).
# Its own workspace: each spike pins its toolkit's toolchain and takes this crate by path.
[workspace]

[package]
name = "lumia-spike-data"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
lumia-client = { path = "../../apps/core/crates/lumia-client" }
lumia-core = { path = "../../apps/core/crates/lumia-core" }
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
