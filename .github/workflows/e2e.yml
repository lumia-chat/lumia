name: e2e

on:
  push:
    branches: [master]
    paths: ["apps/web/**", "apps/core/**", "apps/instance/**", "assets/**", "proto/**", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["apps/web/**", "apps/core/**", "apps/instance/**", "assets/**", "proto/**", ".github/workflows/e2e.yml"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Chromium channel for the suite (empty: the headless shell; chromium: the full build)"
        default: ""

permissions:
  contents: read

# The browser suite (apps/web/e2e/run.ts): the dev instance on :4000, the
# release CLI as the other device, Chromium through Playwright. WebKit runs
# on macOS (macos.yml, and locally every run), where it is Safari's engine;
# Playwright's Linux WebKit build hangs on first navigations and on this
# page's teardown, and is not what any user runs (plan, step 7).
jobs:
  browsers:
    runs-on: ubuntu-24.04
    # A passing job takes about ten minutes. The suite once sat for the
    # six-hour default after a browser went away under it; nothing here
    # may run that long.
    timeout-minutes: 30
    env:
      MIX_ENV: dev
      DB_URL: postgres://postgres:postgres@localhost:5432/lumia_dev
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.4"
          otp-version: "29"
      # 1.4 or later: Bun 1.3.x on Linux closes a finished child's extra
      # stdio descriptors by number after garbage collection, which cuts the
      # next browser's DevTools pipe (oven-sh/bun#47956); the suite then
      # hung on its fourth browser in every run.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown
          components: llvm-tools
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - uses: actions/cache@v4
        with:
          path: |
            apps/instance/deps
            apps/instance/_build
          key: mix-dev-${{ runner.os }}-${{ hashFiles('apps/instance/mix.lock') }}
      # A registry snapshot saved by a cancelled run came back without a
      # crate; this action keeps the registry whole.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/core
          key: e2e
          # The builds succeed even when the suite does not; keep them.
          cache-on-failure: true

      - run: mix deps.get && mix ecto.setup
        working-directory: apps/instance
      - run: cargo build --release -p lumia-cli
        working-directory: apps/core
      - run: bun install --frozen-lockfile && bun run wasm
        working-directory: apps/web
      # The browsers by Playwright version; only their system packages are
      # installed each run.
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock') }}
      - run: bunx playwright install-deps chromium
        working-directory: apps/web
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install chromium
        working-directory: apps/web

      - name: Start the instance
        working-directory: apps/instance
        run: |
          nohup mix phx.server > /tmp/phx.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -H 'accept: application/json' http://localhost:4000/api/v1/instance > /dev/null && exit 0
            sleep 2
          done
          echo "the instance did not come up" >&2; tail -50 /tmp/phx.log; exit 1
      - run: bun run e2e -- chromium
        working-directory: apps/web
        env:
          # Chromium's stderr in the log, and the step's own diagnosis of a hang.
          DEBUG: "pw:browser"
          LUMIA_E2E_CHANNEL: ${{ github.event.inputs.channel || '' }}
        # A passing suite takes about three minutes; every step is bounded
        # at four, and a run that trips several must still end here.
        timeout-minutes: 15
      # The e2ee fault cases, with the CLI as every device (apps/core/scripts/dm-faults.sh).
      - run: apps/core/scripts/dm-faults.sh http://localhost:4000
        env:
          DEBUG: "pw:browser"
        # A passing run takes about two minutes; a hang should not wait longer than this.
        timeout-minutes: 8
      - if: failure()
        run: tail -200 /tmp/phx.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/web/e2e/.work/shots
          if-no-files-found: ignore
