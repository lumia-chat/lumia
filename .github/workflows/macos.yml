name: macos

on:
  push:
    branches: [master]
    paths: ["apps/apple/**", "apps/desktop/**", "apps/web/**", "apps/core/**", "apps/instance/**", "assets/**", "proto/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["apps/apple/**", "apps/desktop/**", "apps/web/**", "apps/core/**", "apps/instance/**", "assets/**", "proto/**", ".github/workflows/macos.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Everything that needs a Mac, on one runner (macOS minutes are the dear
# ones): LumiaKit's tests and the iOS app's build with its smoke runs
# against a dev instance, the desktop shell (apps/desktop) built for Metal
# with its tests and smoke against the same instance, and the browser suite
# in WebKit, Safari's engine, which the Linux job (e2e.yml) cannot run
# reliably. The instance and the release CLI are shared by all three.
#
# The desktop shell's steps were added on 2026-11-11 and have run on a
# developer's Mac only: whether the runner's GPU draws the smoke's headless
# frames is not known until the first run here.
jobs:
  apple:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MIX_ENV: dev
      DB_URL: postgres://postgres:postgres@localhost:5432/lumia_dev
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.4"
          otp-version: "29"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown
          components: llvm-tools
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - run: brew install xcodegen postgresql@18
      - run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      # The web build compiles SQLite for wasm32 with the C compiler; the
      # runner's Apple clang (Xcode 26) has no WebAssembly target, where
      # Xcode 27's does. Homebrew's LLVM is on the image.
      - run: echo "CC_wasm32_unknown_unknown=$(brew --prefix llvm@20)/bin/clang" >> "$GITHUB_ENV"
      # Homebrew's install made a cluster owned by the runner's user with
      # trust authentication on localhost; the instance's URL names the
      # usual postgres superuser.
      - name: Start Postgres
        run: |
          pg="$(brew --prefix postgresql@18)/bin"
          "$pg/pg_ctl" -D "$(brew --prefix)/var/postgresql@18" -l "$RUNNER_TEMP/postgres.log" -w start
          "$pg/createuser" -s postgres
      - uses: actions/cache@v4
        with:
          path: |
            apps/instance/deps
            apps/instance/_build
            # In dev and test the app's priv is a link to apps/instance/priv, so the
            # compiled image library is there and not under _build: without it, a
            # restored build has the module and no library to load.
            apps/instance/priv/native
          key: mix-dev-${{ runner.os }}-${{ hashFiles('apps/instance/mix.lock', 'apps/instance/native/lumia_media/src/**', 'apps/instance/native/lumia_media/Cargo.*') }}
      # The desktop shell is a workspace of its own on Rune's toolchain.
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/core
            apps/desktop
          key: macos-ci
          cache-on-failure: true
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock') }}

      # The core, its bindings and the XCFramework for this runner's
      # architecture and the iOS simulator; the release build is the
      # universal one.
      - run: apps/apple/scripts/core.sh --host --ios
      - run: swift test
        working-directory: apps/apple/LumiaKit
      - run: xcodegen generate
        working-directory: apps/apple/Lumia-iOS
      # Signed to run locally, so the app-group entitlement the extension
      # needs is embedded; with the UI test the push smoke drives.
      - run: |
          set -o pipefail
          xcodebuild build-for-testing -project Lumia.xcodeproj -scheme Lumia -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath .build CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO 2>&1 | grep -E "error:|warning: .*/(LumiaKit|Lumia-iOS)/|BUILD"
        working-directory: apps/apple/Lumia-iOS

      - run: cargo build --release -p lumia-cli
        working-directory: apps/core
      - run: cargo build --locked
        working-directory: apps/desktop
      - run: mix deps.get && mix ecto.setup
        working-directory: apps/instance
      - run: bun install --frozen-lockfile && bun run wasm
        working-directory: apps/web
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install webkit
        working-directory: apps/web

      - name: Start the instance
        working-directory: apps/instance
        run: |
          nohup mix phx.server > "$RUNNER_TEMP/phx.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -H 'accept: application/json' http://localhost:4000/api/v1/instance > /dev/null && exit 0
            sleep 2
          done
          echo "the instance did not come up" >&2; tail -50 "$RUNNER_TEMP/phx.log"; exit 1
      # The desktop shell signed in through LUMIA_DEV_*: the snapshot, the
      # gateway, frames drawn headlessly, a message sent, then every test
      # of the shell with the live ones pointed at this instance.
      - run: apps/desktop/scripts/smoke.sh
        timeout-minutes: 15
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shell-smoke
          path: |
            apps/desktop/out/smoke/*.png
            apps/desktop/out/smoke/*.log
          if-no-files-found: ignore
      # The iOS app in whichever iPhone simulator the runner's Xcode ships,
      # one launch per screen, screenshots kept on failure.
      # 6 to 9 minutes before display settings, 10 and cut off after: half of it is the
      # simulator and the build.
      - run: apps/apple/scripts/smoke-ios.sh
        timeout-minutes: 15
      # The notification extension's path: the phone linked as a second
      # device, a DM accepted elsewhere, the message decrypted for the notice.
      - run: apps/apple/scripts/smoke-push.sh
        timeout-minutes: 12
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screens
          path: |
            apps/apple/.build/smoke-ios/*.png
            apps/apple/.build/smoke-push/*.png
            apps/apple/.build/smoke-push/uitest.log
            apps/apple/.build/smoke-push/uitest-open.log
            apps/apple/.build/smoke-push/sim.log
          if-no-files-found: ignore
      - run: bun run e2e -- webkit
        working-directory: apps/web
        timeout-minutes: 10
      - if: failure()
        run: tail -200 "$RUNNER_TEMP/phx.log" || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-e2e-screenshots
          path: apps/web/e2e/.work/shots
          if-no-files-found: ignore
