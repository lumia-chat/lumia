# The instance on Fly.io (apps/instance/fly.toml): every push to master
# that touches what the image is built from deploys lumia-instance. The
# build runs on a Fly remote builder from the repository root, which the
# Dockerfile needs as its context (it copies the core and the web UI),
# and the rollout is the one fly.toml describes: migrate on a throwaway
# machine first, then rolling. One deploy at a time; a newer push waits
# for the running one rather than racing it. Secret: FLY_API_TOKEN, a
# deploy token scoped to the app (`fly tokens create deploy -a lumia-instance`).
name: deploy

on:
  push:
    branches: [master]
    paths:
      - "apps/instance/**"
      - "apps/web/**"
      - "apps/core/**"
      - "proto/**"
      - "assets/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lumia-instance
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config apps/instance/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
