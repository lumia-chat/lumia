name: desktop

on:
  push:
    paths: ["apps/desktop/**", "apps/web/**", "apps/core/**", "assets/**", "proto/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["apps/desktop/**", "apps/web/**", "apps/core/**", "assets/**", "proto/**", ".github/workflows/desktop.yml"]

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown
          components: llvm-tools
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      # Tauri's Linux prerequisites (WebKitGTK 4.1 and the bundlers' needs).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/core
            apps/desktop/src-tauri
          key: desktop
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: bun install --frozen-lockfile
        working-directory: apps/desktop
      - run: cargo fmt --check && cargo clippy -- -D warnings
        working-directory: apps/desktop/src-tauri
      # Builds ../web first (tauri.conf.json's beforeBuildCommand), then the
      # bundles. The signed updater artifacts are a release's (release.yml).
      - run: bun tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
        working-directory: apps/desktop
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: lumia-desktop-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
