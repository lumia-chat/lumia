name: desktop

on:
  push:
    branches: [master]
    paths: ["apps/desktop/src-tauri/**", "apps/desktop/package.json", "apps/desktop/bun.lock", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["apps/desktop/src-tauri/**", "apps/desktop/package.json", "apps/desktop/bun.lock", ".github/workflows/desktop.yml"]

permissions:
  contents: read

# The Tauri shell only: the Rune shell beside it in apps/desktop has no job
# yet (plan step 9), so its files do not start this one.
# The Tauri shell's crate, linted on the two platforms it ships to. The
# bundles are a release's (release.yml, on a v* tag), not a push's: the
# web UI the shell carries has its own job (web.yml), and the shell's
# Rust is checked here without building it.
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      # Tauri's Linux prerequisites (WebKitGTK 4.1).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/core
            apps/desktop/src-tauri
          key: desktop
      - run: cargo fmt --check && cargo clippy -- -D warnings
        working-directory: apps/desktop/src-tauri
