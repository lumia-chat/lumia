name: core

on:
  push:
    branches: [master]
    paths: ["apps/core/**", "proto/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["apps/core/**", "proto/**", ".github/workflows/core.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/core

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Reads apps/core/rust-toolchain.toml (channel, components, targets).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/core/target
          key: core-${{ runner.os }}-${{ hashFiles('apps/core/Cargo.lock') }}
          restore-keys: core-${{ runner.os }}-

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # SQLite is compiled to wasm by the cc crate, which needs an archiver
      # that understands wasm objects (docs/spikes/2026-11-02-web-store.md).
      - run: rustup component add llvm-tools
      - run: echo "AR_wasm32_unknown_unknown=$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/host: //p')/bin/llvm-ar" >> "$GITHUB_ENV"
      - run: cargo check -p lumia-client -p lumia-wasm --target wasm32-unknown-unknown
