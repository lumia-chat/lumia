name: web

on:
  push:
    paths: ["apps/web/**", "assets/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["apps/web/**", "assets/**", ".github/workflows/web.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - run: bun run build
