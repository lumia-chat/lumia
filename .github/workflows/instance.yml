name: instance

on:
  push:
    branches: [master]
    paths: ["apps/instance/**", ".github/workflows/instance.yml"]
  pull_request:
    paths: ["apps/instance/**", ".github/workflows/instance.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/instance

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: test
      DB_URL: postgres://postgres:postgres@localhost:5432/lumia_test
      # The dev build here is for the load test, which refuses the code
      # reloader (a compile-time switch of the endpoint): every dev compile
      # in this job, and the cached build, must agree with it.
      LUMIA_CODE_RELOADER: "false"
      # The runner's pg_wrapper picks its preinstalled client; the backup
      # commands take the server's major from here.
      PG_BIN: /usr/lib/postgresql/18/bin
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.4"
          otp-version: "29"

      # native/lumia_media (the image work for uploads) is built by Rustler
      # when the instance compiles; its rust-toolchain.toml names this version.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"

      - uses: actions/cache@v4
        with:
          path: |
            apps/instance/deps
            apps/instance/_build
            apps/instance/native/lumia_media/target
          key: mix-${{ runner.os }}-${{ hashFiles('apps/instance/mix.lock', 'apps/instance/native/lumia_media/Cargo.lock') }}
          restore-keys: mix-${{ runner.os }}-

      # The backup and restore commands shell out to pg_dump and pg_restore
      # of the server's major (docs/specs/deployment.md section 4).
      - name: Postgres 18 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 3 --retry-all-errors -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18
      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      - run: mix format --check-formatted
      # No typespecs: nothing verifies them (no Dialyzer), so they could be wrong.
      - name: No typespec attributes
        run: |
          if grep -rnE '^\s*@(spec|type|typep|opaque|typedoc)\b' lib test bench; then
            echo "typespec attributes are not allowed; see AGENTS.md" >&2
            exit 1
          fi
      - run: mix compile --warnings-as-errors
      # bench/ (spike tasks, Benchee) only compiles in dev.
      - run: MIX_ENV=dev mix compile --warnings-as-errors
      - run: mix credo --strict
      - name: The native library's own tests
        run: cargo fmt --check && cargo test --release
        working-directory: apps/instance/native/lumia_media
      - run: mix test
      - run: mix test.failure_injection
      # The load test's CI mode (architecture section 17): a small fixture
      # on a database of its own, every row the instance can measure, the
      # budgets checked. bench/ compiles in dev only.
      - name: Load test, CI mode
        env:
          MIX_ENV: dev
          LUMIA_CODE_RELOADER: "false"
          DB_URL: postgres://postgres:postgres@localhost:5432/lumia_load
        run: mix do ecto.create + ecto.migrate + lumia.load --ci

  # Two instances side by side (deployment.md section 2.3): the image built
  # here, the cross-instance cases run with the release CLI.
  two-instances:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/core
          key: cli
      - run: cargo build --release -p lumia-cli
        working-directory: apps/core
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/instance/Dockerfile
          tags: lumia/instance
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: LUMIA_IMAGE=lumia/instance apps/instance/deploy/two-instances.sh
