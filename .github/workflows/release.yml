# A release: on a v* tag, and only then, the desktop apps are built,
# signed and attached to one GitHub Release (architecture section 13,
# "Distribution"). The release starts as a draft and is published only
# when every job succeeds, so the "latest" feeds the apps read (Sparkle's
# appcast.xml, Tauri's latest.json) never point at a half-built release.
#
# The version is the tag without its v. Secrets: DEVELOPER_ID_P12 and
# DEVELOPER_ID_P12_PASSWORD (the Developer ID Application certificate with
# its key, base64 of the .p12), ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the
# App Store Connect API key, base64 of the .p8; notarization),
# SPARKLE_PRIVATE_KEY (the appcast's EdDSA key), TAURI_SIGNING_PRIVATE_KEY
# (the updater's minisign key).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Lumia ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  macos:
    needs: draft
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/core
          key: macos
      - run: brew install xcodegen
      - run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - name: Keys
        run: |
          echo "$ASC_KEY_P8" | base64 -d > "$RUNNER_TEMP/asc.p8"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      # The Developer ID certificate goes into a keychain of its own, which
      # xcodebuild's manual signing finds through the search list; the
      # partition list lets Apple's tools use the key without a prompt.
      - name: Developer ID certificate
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(uuidgen)
          echo "$DEVELOPER_ID_P12" | base64 -d > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/developer-id.p12"
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application" || { echo "no Developer ID identity"; exit 1; }
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      # The previous release's DMG lets Sparkle publish a delta update too.
      - run: gh release download --pattern 'Lumia-*.dmg' -D "$RUNNER_TEMP/previous" || true
        env:
          GH_TOKEN: ${{ github.token }}
      - run: apps/apple/scripts/dist.sh "${GITHUB_REF_NAME#v}" --sign
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
          SPARKLE_KEY_PATH: ${{ runner.temp }}/sparkle.key
          LUMIA_PREVIOUS_DIR: ${{ runner.temp }}/previous
      - run: gh release upload "$GITHUB_REF_NAME" apps/apple/.build/dist/*
        env:
          GH_TOKEN: ${{ github.token }}

  desktop:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        # The oldest Ubuntu the runners offer, so the AppImage's glibc floor is low.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown
          components: llvm-tools
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/core
            apps/desktop/src-tauri
          key: desktop
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: bun install --frozen-lockfile
        working-directory: apps/desktop
      # The tag is the version; tauri.conf.json's is the development placeholder.
      - run: bun -e 'const f = "src-tauri/tauri.conf.json"; const fs = require("fs"); const c = JSON.parse(fs.readFileSync(f)); c.version = process.env.GITHUB_REF_NAME.slice(1); fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n")'
        working-directory: apps/desktop
        shell: bash
      # Builds ../web first (tauri.conf.json's beforeBuildCommand), then the
      # bundles and the signed updater artifacts, and attaches them with
      # latest.json to the draft release.
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          tauriScript: bun tauri
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  publish:
    needs: [macos, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
