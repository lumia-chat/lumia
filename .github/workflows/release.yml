# A release: on a v* tag, and only then, every platform's app is built
# (architecture section 13, "Distribution"). The Mac app and the Android
# APK are signed and attached to one GitHub Release; the desktop shell for
# Windows and Linux is attached beside them as previews; and the iOS app
# is uploaded to App Store Connect for TestFlight, the only channel an
# iPhone has. (The same tag deploys the instance: deploy.yml.)
#
# The release starts as a draft and is published once the Mac app and the
# APK are on it, so the "latest" feed the Mac app reads (Sparkle's
# appcast.xml) never points at a half-built release. Three jobs do not
# gate it: the Windows and Linux previews, which nobody has run on those
# systems and which are waited for but may fail, and the iOS upload,
# which can be re-sent without a new tag (ios-upload.yml).
#
# A tag with a hyphen in it (v0.3.0-rc.1) is a pre-release, for trying the
# builds themselves: the same jobs run and the release is published marked
# as a pre-release and not as the latest, so no installed Mac app is
# offered it and the instance is not deployed. The iOS build goes to
# TestFlight under the version before the hyphen, which is all the store
# takes.
#
# The version is the tag without its v. Secrets: DEVELOPER_ID_P12 and
# DEVELOPER_ID_P12_PASSWORD (the Developer ID Application certificate with
# its key, base64 of the .p12), ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the
# App Store Connect API key, base64 of the .p8; notarization and the iOS
# upload), SPARKLE_PRIVATE_KEY (the appcast's EdDSA key),
# ANDROID_KEYSTORE (the release keystore, base64 of the .jks),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, and
# GOOGLE_SERVICES_JSON (the Firebase project's file, for FCM; optional, the
# build has UnifiedPush alone without it).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          case "$GITHUB_REF_NAME" in *-*) kind=--prerelease ;; *) kind= ;; esac
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Lumia ${GITHUB_REF_NAME#v}" --generate-notes $kind
        env:
          GH_TOKEN: ${{ github.token }}

  # The Mac app is the desktop shell (apps/desktop): a universal binary,
  # bundled with Sparkle, signed with the Developer ID, notarized, on a disk
  # image, with the appcast installed apps read. scripts/dist-macos.sh does
  # all of it and, with --release, stops rather than publish anything
  # unsigned. Its bundle step draws a frame headlessly, so this job needs
  # a runner whose GPU draws (macos.yml's smoke shows whether one does).
  #
  # Written on 2026-11-11 and not yet run: the signing and notarizing branch
  # of the script has never had credentials, and no tag has been pushed
  # since the shell replaced the SwiftUI app.
  macos:
    needs: draft
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count, and it is what Sparkle compares
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
          key: macos-release
      - name: Keys
        run: |
          echo "$ASC_KEY_P8" | base64 -d > "$RUNNER_TEMP/asc.p8"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      # The Developer ID certificate goes into a keychain of its own, which
      # codesign finds through the search list; the partition list lets
      # Apple's tools use the key without a prompt. The identity's name is
      # read back from it for the scripts.
      - name: Developer ID certificate
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(uuidgen)
          echo "$DEVELOPER_ID_P12" | base64 -d > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/developer-id.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          [ -n "$identity" ] || { echo "no Developer ID identity"; exit 1; }
          echo "LUMIA_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      # The previous release's image lets Sparkle publish a delta update
      # too. Not from the releases up to 0.2.1: their image is the SwiftUI
      # app this one replaced, and no delta is made between the two.
      - name: Previous image
        run: |
          previous=$(gh release view --json tagName -q .tagName || true)
          case "$previous" in
            ""|v0.1.*|v0.2.0|v0.2.1) echo "no previous image of this app ($previous)" ;;
            *) gh release download "$previous" --pattern 'Lumia-*.dmg' -D "$RUNNER_TEMP/previous" || true ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Universal binary
        working-directory: apps/desktop
        run: |
          cargo build --release --locked --target aarch64-apple-darwin --target x86_64-apple-darwin
          lipo -create target/aarch64-apple-darwin/release/lumia target/x86_64-apple-darwin/release/lumia -output "$RUNNER_TEMP/lumia"
      - run: apps/desktop/scripts/dist-macos.sh "${GITHUB_REF_NAME#v}" --release --bin "$RUNNER_TEMP/lumia"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
          SPARKLE_KEY_PATH: ${{ runner.temp }}/sparkle.key
          LUMIA_PREVIOUS_DIR: ${{ runner.temp }}/previous
      - run: gh release upload "$GITHUB_REF_NAME" apps/desktop/out/dist/*
        env:
          GH_TOKEN: ${{ github.token }}

  # The iOS archive, signed automatically with the team's Apple Distribution
  # certificate through the API key (App Store signing is cloud-managed,
  # unlike Developer ID above), and uploaded; it appears in TestFlight once
  # App Store Connect has processed it.
  ios:
    needs: draft
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: aarch64-apple-darwin,aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/core
          key: ios
      - run: brew install xcodegen
      # Xcode 26.6 refuses the App Store Connect API key for automatic signing
      # ("Authentication failed: Make sure a bearer token was provided");
      # 26.5 on the same image accepts it, as does 27 (ios-upload.yml takes a
      # version to try the image's others).
      - run: echo "DEVELOPER_DIR=/Applications/Xcode_26.5.app/Contents/Developer" >> "$GITHUB_ENV"
      - run: echo "$ASC_KEY_P8" | base64 -d > "$RUNNER_TEMP/asc.p8"
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      # The store takes a version of numbers and dots: a pre-release tag's is
      # the part before its hyphen.
      - run: |
          version=${GITHUB_REF_NAME#v}
          apps/apple/scripts/release.sh "${version%%-*}" --upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8

  # The signed APK, the core optimized and stripped for arm64 (the same
  # steps as android.yml, in release). The keystore is the one every
  # build of the app has been signed with: Android installs an update only
  # over the same key, so losing it means a new application id.
  android:
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version code is the commit count
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: aarch64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/core
          key: android-release
      - uses: gradle/actions/setup-gradle@v4
      - name: Keys
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          [ -s "$RUNNER_TEMP/release.jks" ] || { echo "no ANDROID_KEYSTORE secret"; exit 1; }
          [ -z "$GOOGLE_SERVICES_JSON" ] || printf '%s' "$GOOGLE_SERVICES_JSON" > apps/android/app/google-services.json
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      - run: apps/android/scripts/release.sh "${GITHUB_REF_NAME#v}"
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: gh release upload "$GITHUB_REF_NAME" apps/android/.build/dist/*.apk
        env:
          GH_TOKEN: ${{ github.token }}

  # The desktop shell for Linux: a tarball and a .deb, both previews (the
  # head of scripts/dist-linux.sh says why), one pair per architecture. Built
  # on the oldest Ubuntu the runners offer, so the binary runs on a glibc as
  # old as that one's. The script's steps ran in ubuntu:22.04 and 24.04
  # containers on arm64 before this job was written; on x86-64 it has not
  # run, and the frame is drawn by a software driver that may refuse the
  # shell's shaders there (shell.yml says more), so that step may fail
  # without failing the job.
  linux:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev imagemagick desktop-file-utils mesa-vulkan-drivers fonts-noto-cjk fonts-noto-color-emoji
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
          key: linux-release
      - run: apps/desktop/scripts/dist-linux.sh "${GITHUB_REF_NAME#v}"
      # The package installed as a person would install it, and its program
      # drawing the first screen.
      - name: Install the package and draw a frame
        continue-on-error: true
        timeout-minutes: 5
        env:
          LUMIA_DATA_DIR: ${{ runner.temp }}/lumia
        run: |
          sudo apt-get install -y ./apps/desktop/out/dist/Lumia-*-preview.deb
          VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1) lumia --snap "$RUNNER_TEMP/sign-in.png"
          test -s "$RUNNER_TEMP/sign-in.png"
      - run: gh release upload "$GITHUB_REF_NAME" apps/desktop/out/dist/*
        env:
          GH_TOKEN: ${{ github.token }}

  # The desktop shell for Windows: a zip holding Lumia.exe, a preview (the
  # head of scripts/dist-windows.sh says why). Cross-built on Linux with
  # MinGW-w64, which is what could be run before this job was written: in a
  # container, to the same zip. Nothing has run the program.
  windows:
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 zip
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
          key: windows-release
      - run: apps/desktop/scripts/dist-windows.sh "${GITHUB_REF_NAME#v}"
      - run: gh release upload "$GITHUB_REF_NAME" apps/desktop/out/dist/*
        env:
          GH_TOKEN: ${{ github.token }}

  # Waits for every job that attaches something, and publishes when the two
  # that gate the release succeeded, whatever became of the previews.
  publish:
    needs: [macos, android, linux, windows]
    if: ${{ !cancelled() && needs.macos.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # "Latest" is what the Mac app's update feed follows, so a pre-release
      # is never that.
      - run: |
          case "$GITHUB_REF_NAME" in
            *-*) gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease ;;
            *) gh release edit "$GITHUB_REF_NAME" --draft=false --latest ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
