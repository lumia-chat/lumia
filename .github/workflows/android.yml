name: android

on:
  push:
    branches: [master]
    paths: ["apps/android/**", "apps/core/**", "assets/design/**", "proto/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", "apps/core/**", "assets/design/**", "proto/**", ".github/workflows/android.yml"]

permissions:
  contents: read

# The Android app: the core for arm64 through cargo-ndk, the Kotlin
# bindings, the tokens, and the debug build with Gradle. The emulator
# smoke (apps/android/scripts/smoke.sh) runs locally; a hosted emulator
# needs KVM and minutes this job does not spend yet.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: aarch64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/core
          key: android
      - uses: gradle/actions/setup-gradle@v4
      - run: apps/android/scripts/core.sh --arm64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/android
      - uses: actions/upload-artifact@v4
        with:
          name: lumia-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
