[package]
name = "lumia-core"
description = "Lumia client core: sync engine, identity, store and keystore contracts. No I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
lumia-proto.workspace = true
prost.workspace = true
prost-types.workspace = true
thiserror.workspace = true
uuid.workspace = true

# Identity (docs/specs/identity.md section 2).
bip39 = "3"
hkdf = "0.13"
sha2 = "0.11"
ed25519-dalek = "3"
x25519-dalek = { version = "3", features = ["static_secrets"] }
chacha20poly1305 = "0.11"
blake3 = "1"
getrandom = "0.4"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"

# Randomness in the browser comes from the JS host.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["v7", "v4", "js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[lints]
workspace = true
