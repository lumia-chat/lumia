[package]
name = "lumia-cli"
description = "The headless Lumia client: drives the native client against a running instance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "lumia-cli"
path = "src/main.rs"

[dependencies]
lumia-core.workspace = true
lumia-client.workspace = true
prost.workspace = true
prost-types.workspace = true
uuid.workspace = true
tracing.workspace = true
futures-util.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
url = "2"
base64 = "0.22"
hex = "0.4"
ed25519-dalek = "3"

[lints]
workspace = true
