[package]
name = "lumia-client"
description = "Native transport and store for the Lumia core, plus the headless lumia-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "lumia-cli"
path = "src/main.rs"

[dependencies]
lumia-core.workspace = true
lumia-proto.workspace = true
prost.workspace = true
prost-types.workspace = true
thiserror.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
rusqlite = { version = "0.41", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
url = "2"
base64 = "0.22"
hex = "0.4"
ed25519-dalek = "3"

[lints]
workspace = true
