[package]
name = "lumia-ffi"
description = "UniFFI surface for the Swift and Kotlin shells: one Client object and a listener callback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
lumia-core.workspace = true
lumia-client.workspace = true
thiserror.workspace = true
uuid.workspace = true
uniffi = "0.32"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

# Android's TLS (src/android.rs): the JNI entry point that sets up the
# platform verifier, on the jni the verifier itself uses.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "0.7"

[lints]
workspace = true
