# The macOS app (architecture section 13): the SwiftUI layout for the
# desktop over LumiaKit. `xcodegen generate` (xcodegen 2.45+) makes the
# project, which is not committed; `scripts/core.sh` must have run first.
name: Lumia
options:
  bundleIdPrefix: chat.lumia
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
packages:
  LumiaKit:
    path: ../LumiaKit
  # Updates for the direct-download build (architecture section 13,
  # "Distribution"): Sparkle reads the appcast a tagged release publishes.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"
targets:
  Lumia:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: LumiaKit
      - package: Sparkle
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Lumia
        CFBundleName: Lumia
        # XcodeGen's defaults are literal "1.0" and "1"; the version is
        # MARKETING_VERSION (the release tag), the build number the commit
        # count the scripts pass as CURRENT_PROJECT_VERSION.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        # Export compliance: the app ships its own encryption (the
        # end-to-end encrypted DMs, the encrypted store), so it is not
        # exempt. App Store Connect asks on the first build; once it issues
        # a code, ITSEncryptionExportComplianceCode goes here so later
        # uploads skip the question. Declaring non-exempt without the code
        # is refused at upload.
        LSApplicationCategoryType: public.app-category.social-networking
        # Sparkle: the appcast of the latest GitHub release and the EdDSA
        # key that signs its entries (the private half is a CI secret,
        # scripts/dist.sh). Checks are automatic unless the user turns them
        # off in the Lumia menu; the feed URL is a build setting so a fork
        # points its builds at its own releases.
        SUFeedURL: $(LUMIA_UPDATE_FEED)
        SUPublicEDKey: $(LUMIA_UPDATE_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    entitlements:
      path: Lumia.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: false
        # Sparkle's installer and status XPC services, which a sandboxed
        # app reaches by name.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        # One bundle ID for macOS and iOS: one App Store Connect record
        # carries both platforms (one listing, one TestFlight app).
        PRODUCT_BUNDLE_IDENTIFIER: chat.lumia
        SWIFT_VERSION: "5.10"
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Automatic signing with the team; a debug build on this machine
        # (xcodebuild ... CODE_SIGNING_ALLOWED=NO) skips it, a release
        # archive (scripts/release.sh) uses the team's distribution assets.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UZAQ69P4MG
        ENABLE_HARDENED_RUNTIME: true
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Where the direct-download build looks for updates (Info.plist's
        # SUFeedURL and SUPublicEDKey). The appcast is an asset of every
        # tagged release; "latest" resolves to the newest published one.
        LUMIA_UPDATE_FEED: https://github.com/lumia-chat/lumia/releases/latest/download/appcast.xml
        LUMIA_UPDATE_KEY: GRG890/GstHa+rDtxagnkw6PqSKwmK6D2CwImxkD4yw=
