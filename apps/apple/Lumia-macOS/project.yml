# The macOS app (architecture section 13): the SwiftUI layout for the
# desktop over LumiaKit. `xcodegen generate` (xcodegen 2.45+) makes the
# project, which is not committed; `scripts/core.sh` must have run first.
name: Lumia
options:
  bundleIdPrefix: chat.lumia
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
packages:
  LumiaKit:
    path: ../LumiaKit
targets:
  Lumia:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: LumiaKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Lumia
        CFBundleName: Lumia
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
    entitlements:
      path: Lumia.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.lumia.macos
        SWIFT_VERSION: "5.10"
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: true
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
