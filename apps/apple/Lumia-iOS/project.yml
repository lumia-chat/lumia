# The iOS app (architecture section 13): the SwiftUI layout for a phone
# over LumiaKit, and its notification service extension (architecture
# 15.5). `xcodegen generate` (xcodegen
# 2.45+) makes the project, which is not committed; `scripts/core.sh
# --ios` must have run first (it adds the iOS device and simulator slices
# to the XCFramework).
name: Lumia
options:
  bundleIdPrefix: chat.lumia
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
packages:
  LumiaKit:
    path: ../LumiaKit
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: UZAQ69P4MG
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "1"
    # The core's simulator slice is arm64 (core.sh --ios); an Intel
    # simulator would need an x86_64 build of it too.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  Lumia:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: LumiaKit
      - target: LumiaNotifications
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Lumia
        CFBundleName: Lumia
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The browser sheet's way back (a sign-in through the instance's
        # web page or its OIDC provider returns on it with a one-time token).
        CFBundleURLTypes:
          - CFBundleURLName: chat.lumia
            CFBundleURLSchemes: [lumia]
        LSApplicationCategoryType: public.app-category.social-networking
        # Export compliance: the app ships its own encryption (the
        # end-to-end encrypted DMs, the encrypted store), so it is not
        # exempt. App Store Connect asked on the record's first build and
        # issues a code; once it does, ITSEncryptionExportComplianceCode
        # goes here so later uploads skip the question. Declaring
        # non-exempt without the code is refused at upload.
        # A launch screen from the plist (no storyboard): the app's
        # background colour, drawn until the first frame.
        UILaunchScreen: {}
        # The read wake (architecture 15.5): a silent push when the account
        # reads something on another device, for the badge and to take away
        # the notifications of what is now read.
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSHumanReadableCopyright: ""
    entitlements:
      path: Lumia.entitlements
      properties:
        # Pushes through the relay, and the container the extension shares.
        aps-environment: development
        com.apple.security.application-groups: [group.chat.lumia]
    settings:
      base:
        # One bundle ID with the Mac app (apps/desktop), which is a direct
        # download: the App Store Connect record carries a macOS platform too,
        # with nothing submitted to it.
        PRODUCT_BUNDLE_IDENTIFIER: chat.lumia
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  # The notification service extension: the same core and stores as the
  # app (the app group), the generic notice replaced by the message.
  LumiaNotifications:
    type: app-extension
    platform: iOS
    sources:
      - Notifications
    dependencies:
      - package: LumiaKit
    info:
      path: Notifications/Info.plist
      properties:
        CFBundleDisplayName: Lumia Notifications
        CFBundleName: LumiaNotifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Notifications/LumiaNotifications.entitlements
      properties:
        com.apple.security.application-groups: [group.chat.lumia]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.lumia.notifications
        TARGETED_DEVICE_FAMILY: "1,2"
  # The UI tests the smokes drive (scripts/smoke-push.sh for the
  # notification prompt and the tap, scripts/smoke-typing.sh for a channel
  # with someone typing in it); not a test suite.
  LumiaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Lumia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.lumia.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Lumia:
    build:
      targets:
        Lumia: all
        LumiaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [LumiaUITests]
    archive:
      config: Release
