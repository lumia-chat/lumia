# The Lumia desktop shell for macOS, Windows and Linux (architecture section 13): one Rust
# program on Rune with the client core linked in. `src-tauri` beside this crate is the Tauri
# shell it replaces on Windows and Linux; the two share nothing.
#
# Its own workspace: Rune pins a newer toolchain and edition than apps/core, and its
# dependency tree stays out of the core's lock.
[workspace]
exclude = ["src-tauri"]

[package]
name = "lumia-shell"
version = "0.2.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "The Lumia desktop shell: the client core behind a Rune interface (architecture section 13)"
publish = false

[[bin]]
name = "lumia"
path = "src/main.rs"

[dependencies]
# Rune is pre-release and asks for a pinned rev of `dev`. Bump both crates and both patches
# below together.
rune = { git = "https://github.com/anomalyco/rune", rev = "1f1b6c22c4476b06adc812c9abe3e37c97ffa398", default-features = false, features = ["accessibility", "dbus", "metal-backend", "svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "1f1b6c22c4476b06adc812c9abe3e37c97ffa398", features = ["markdown"] }
lumia-client = { path = "../core/crates/lumia-client" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
serde_json = "1"
# The fonts in assets/fonts are WOFF2 and Rune reads TrueType.
wuff = "0.2.10"

# Rune builds against its own patched wgpu-hal and winit, and a dependency's `[patch]` does not
# reach the workspace that depends on it, so an app that builds Rune repeats them.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "1f1b6c22c4476b06adc812c9abe3e37c97ffa398" }
winit = { git = "https://github.com/anomalyco/rune", rev = "1f1b6c22c4476b06adc812c9abe3e37c97ffa398" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
