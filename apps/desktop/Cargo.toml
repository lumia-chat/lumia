# The Lumia desktop shell for macOS, Windows and Linux (architecture section 13): one Rust
# program on Rune with the client core linked in.
#
# Its own workspace: Rune pins a newer toolchain and edition than apps/core, and its
# dependency tree stays out of the core's lock.
#
# `crates/sparkle` is the bridge to the macOS updater and the one member where `unsafe` is
# allowed (its manifest says why). Both are default members, so a bare `cargo test`,
# `cargo clippy` or `cargo fmt` here covers it too.
[workspace]
members = [".", "crates/sparkle"]
default-members = [".", "crates/sparkle"]

[package]
name = "lumia-shell"
version = "0.7.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "The Lumia desktop shell: the client core behind a Rune interface (architecture section 13)"
publish = false

[[bin]]
name = "lumia"
path = "src/main.rs"

[features]
# This thread's CPU clock for `benches/timeline.rs`; ordinary builds carry none.
profile = ["rune/frame-profile"]

[[bench]]
name = "timeline"
harness = false
required-features = ["profile"]

[dependencies]
# Rune is pre-release and asks for a pinned rev of `dev`. Bump the four crates and the four
# patches below together.
# `tooling` keeps `--snap` and the other headless runs in a release build (Rune's default since
# 74a3c8d4 is debug builds only): the bundle and package checks draw a frame with the shipped binary.
rune = { git = "https://github.com/anomalyco/rune", rev = "74a3c8d4f4aadbdadcc8fae0aee5e36f42af1ccd", default-features = false, features = ["accessibility", "dbus", "metal-backend", "native-file-dialog", "svg", "tooling"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "74a3c8d4f4aadbdadcc8fae0aee5e36f42af1ccd" }
# The window's remembered frame on macOS (`rune-mac`) and system notifications (`rune-notify`:
# macOS and Windows; nothing posts elsewhere). Both at Rune's rev, bumped with it.
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "74a3c8d4f4aadbdadcc8fae0aee5e36f42af1ccd" }
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "74a3c8d4f4aadbdadcc8fae0aee5e36f42af1ccd" }
lumia-client = { path = "../core/crates/lumia-client" }
# Sparkle, the macOS app's updater, loaded at run time from the bundle (`src/platform/updates.rs`).
# Off macOS, and in a bare binary, it is the same surface with nothing behind it.
lumia-sparkle = { path = "crates/sparkle" }
# Message bodies (`ui::body`): the version Rune's kit locked, CommonMark and strikethrough only.
pulldown-cmark = { version = "0.13.6", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The `state` a browser sign-in carries out and must bring back (src/app/links.rs).
getrandom = "0.4"
# The emoji picker's list, names and groups (Unicode's, fully qualified; src/ui/emoji.rs).
emojis = "0.9.1"

[build-dependencies]
serde_json = "1"
# The fonts in assets/fonts are WOFF2 and Rune reads TrueType.
wuff = "0.2.10"

# Rune builds against its own patched wgpu-hal, winit, parley_engine and accesskit_windows, and a
# dependency's `[patch]` does not reach the workspace that depends on it, so an app that builds
# Rune repeats them.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "74a3c8d4f4aadbdadcc8fae0aee5e36f42af1ccd" }
winit = { git = "https://github.com/anomalyco/rune", rev = "74a3c8d4f4aadbdadcc8fae0aee5e36f42af1ccd" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "74a3c8d4f4aadbdadcc8fae0aee5e36f42af1ccd" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "74a3c8d4f4aadbdadcc8fae0aee5e36f42af1ccd" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# For measurements against architecture 17's budgets: release without incremental
# compilation, which can move frame timings (Rune's own profile for its numbers).
[profile.perf]
inherits = "release"
opt-level = 3
codegen-units = 16
lto = false
debug = false
incremental = false
