# The instance's one native library: image work for uploads (architecture 3
# and 12). Its own workspace, built by Rustler when the instance compiles.
[package]
name = "lumia_media"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[lib]
name = "lumia_media"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38"
# Decoders in Rust only: no format here links C (architecture 3 sends those
# through a Port worker instead, and none is needed yet).
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# A picture's embedded colour profile converted to sRGB; already in the tree
# under `image`, and Rust only.
moxcms = { version = "0.8.1", default-features = false }
# `image`'s WebP decoder, used directly for WebP so that its memory limit can be set: `image`
# does not pass its own limit on. Patched, below.
image-webp = "0.2.4"

[dev-dependencies]
# To write an APNG in the tests; `image` reads them through this crate but cannot write one.
png = "0.18"
# The tests' global allocator, counting what one thread holds at once, to check what a decode
# reserves against what it really allocates. Linked into the tests only.
allocation-counter = "0.8"

[lints.rust]
unsafe_code = "forbid"

[workspace]
# The vendored crate keeps its published manifest and dev-dependencies, so it is no member.
exclude = ["vendor/image-webp"]

# image-webp 0.2.4 with its memory limit covering a lossless stream's prefix codes, until a
# release has it: vendor/image-webp/PATCHES.md says what is changed and when to drop it.
[patch.crates-io]
image-webp = { path = "vendor/image-webp" }
