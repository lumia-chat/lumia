// Lumia protocol: identity, device roster, identity proof.
//
// Implements docs/architecture.md section 5 and docs/specs/identity.md.
// Everything that is signed is carried as the exact bytes that were signed
// (a `bytes body` holding a serialized inner message), so no canonicalization
// is ever needed. A roster verifies standalone: every device entry carries a
// certificate chaining to a root, so an instance seeing version N for the
// first time needs no earlier version.

syntax = "proto3";

package lumia.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "chat.lumia.proto.v1";
option swift_prefix = "Lumia";

// Ed25519 public key, 32 bytes.
message PublicKey {
  bytes ed25519 = 1;
}

message Signature {
  SignerKind signer_kind = 1;
  // DEVICE: the device_id. ROOT: the 32-byte root public key that signed,
  // so a rotation can carry signatures by both the old and the new root.
  bytes signer_id = 2;
  // Ed25519 signature, 64 bytes, over the exact `body` bytes it accompanies.
  bytes signature = 3;
}

enum SignerKind {
  SIGNER_KIND_UNSPECIFIED = 0;
  ROOT = 1;
  DEVICE = 2;
}

enum DeviceKind {
  DEVICE_KIND_UNSPECIFIED = 0;
  NATIVE = 1;      // macOS, Windows, Linux, iOS, Android app
  WEB = 2;         // browser; origin-scoped, never holds the backup key
  BOT = 3;         // a bot or agent process
}

// The signed content of a device certificate. Serialized and carried as
// DeviceEntry.cert_body. Signed by the root or by the device that added it.
message DeviceCertBody {
  bytes identity_id = 1;
  bytes device_id = 2;
  PublicKey public_key = 3;
  DeviceKind kind = 4;
  google.protobuf.Timestamp added_at = 5;
  // device_id of the authorizing device; empty when the root authorized.
  bytes added_by = 6;
  // WEB only: the origin this device key is scoped to.
  string web_origin = 7;
}

message DeviceEntry {
  // Serialized DeviceCertBody. The fields below mirror it for convenience and
  // MUST match it; verifiers read the body, not the mirrors.
  bytes cert_body = 1;
  Signature authorization = 2;

  bytes device_id = 3;
  PublicKey public_key = 4;
  DeviceKind kind = 5;
  google.protobuf.Timestamp added_at = 6;
  bytes added_by = 7;
  string web_origin = 8;
  // Human label, user-editable, not signed.
  string label = 9;
}

// Serialized and carried as RevokedEntry.body. Signed by the root or by an
// authorized device.
message RevocationBody {
  bytes identity_id = 1;
  bytes device_id = 2;
  google.protobuf.Timestamp revoked_at = 3;
  bytes revoked_by = 4;  // device_id, or empty for root
  // The revoked device's public key and the added_at from its certificate,
  // carried here because its DeviceEntry leaves the roster. Certificates it
  // issued before revoked_at stay verifiable from the roster alone.
  PublicKey public_key = 5;
  google.protobuf.Timestamp added_at = 6;
}

message RevokedEntry {
  bytes body = 1;
  Signature signature = 2;

  bytes device_id = 3;
  google.protobuf.Timestamp revoked_at = 4;
  bytes revoked_by = 5;
}

// Serialized and carried as RootRotation.body. Signed by the predecessor root.
message RootRotationBody {
  bytes identity_id = 1;
  PublicKey from = 2;
  PublicKey to = 3;
  google.protobuf.Timestamp rotated_at = 4;
}

message RootRotation {
  bytes body = 1;
  // By `from`.
  Signature signature = 2;
}

// The signed content of a roster. Serialized and carried as SignedRoster.body.
message RosterBody {
  // BLAKE3-256 of the first root public key; stable across rotations.
  bytes identity_id = 1;
  // Monotonic. Highest version wins; at equal version a ROOT signature wins.
  uint64 version = 2;
  // Current root public key.
  PublicKey root_public_key = 3;
  // Oldest first. Empty when the root has never rotated. The chain starts at
  // the key whose hash is identity_id and ends at root_public_key.
  repeated RootRotation rotations = 4;
  repeated DeviceEntry devices = 5;
  repeated RevokedEntry revoked = 6;
  google.protobuf.Timestamp issued_at = 7;
}

message SignedRoster {
  // Serialized RosterBody. Verify signatures over these bytes exactly.
  bytes body = 1;
  // At least one, by the current root or by a device that is authorized and
  // not revoked in this body.
  repeated Signature signatures = 2;
}

// Issued by a host before account creation, sign-in by identity proof, or
// account linking. Serialized and carried as IdentityProof.challenge.
message IdentityChallengeBody {
  bytes nonce = 1;              // 32 random bytes
  string host = 2;              // the host that issued it; binds the proof
  google.protobuf.Timestamp expires_at = 3;
  ChallengePurpose purpose = 4;
  // HMAC-SHA256 by the issuing instance over the fields above, so issuing a
  // challenge stores nothing. Opaque to clients.
  bytes mac = 5;
}

enum ChallengePurpose {
  CHALLENGE_PURPOSE_UNSPECIFIED = 0;
  CREATE_ACCOUNT = 1;
  SIGN_IN = 2;
  LINK_ACCOUNT = 3;  // also requires the account's own authentication
  JOIN_AS_GUEST = 4;
}

message IdentityProof {
  // Serialized IdentityChallengeBody exactly as issued.
  bytes challenge = 1;
  bytes identity_id = 2;
  bytes device_id = 3;
  // Device-key signature over `challenge`.
  Signature signature = 4;
  // The newest roster the client holds. The host stores it if newer than what
  // it has, and verifies device_id is authorized and not revoked in it.
  SignedRoster roster = 5;
}

// Signed profile carried by an identity and imported on link. Instances may
// hold local overrides (architecture 4.1 / 6.3).
message ProfileBody {
  bytes identity_id = 1;
  uint64 version = 2;
  string display_name = 3;
  string pronouns = 4;
  string bio = 5;
  // Content address of the avatar blob on the issuing host, plus the host.
  string avatar_url = 6;
  google.protobuf.Timestamp issued_at = 7;
}

message SignedProfile {
  bytes body = 1;  // serialized ProfileBody
  Signature signature = 2;
}

// What a new device shows as a QR when being added (specs/identity.md 6).
message LinkRequest {
  bytes device_id = 1;
  PublicKey device_public_key = 2;
  // X25519, 32 bytes. The bundle is encrypted to this.
  bytes ephemeral_public_key = 3;
  DeviceKind kind = 4;
  string label = 5;
  string web_origin = 6;
  bytes nonce = 7;
}

// Plaintext of a link bundle, before encryption to the ephemeral key.
message LinkBundleBody {
  SignedRoster roster = 1;
  // Absent for WEB devices.
  bytes backup_key = 2;
  repeated HostAccount accounts = 3;
  repeated PinnedKey pinned_keys = 4;
  bytes nonce = 5;  // echoes LinkRequest.nonce
}

message HostAccount {
  string host = 1;
  bytes account_id = 2;
}

message PinnedKey {
  bytes identity_id = 1;
  PublicKey root_public_key = 2;
  uint64 roster_version = 3;
  bool verified = 4;  // safety number compared in person
  google.protobuf.Timestamp pinned_at = 5;
}

// The new backup key after a root rotation (specs/identity.md 4.5 step 5),
// sealed to each native device of the identity but the rotating one:
// XChaCha20-Poly1305 under a key agreed between the sender's ephemeral
// X25519 key and the device's Ed25519 key read as X25519, carried to the
// devices on the account log (events.proto BackupKeyHandedOff).
message SealedBackupKey {
  bytes device_id = 1;
  bytes sender_ephemeral_public_key = 2;  // X25519, 32 bytes
  bytes nonce = 3;                         // 24 bytes
  bytes ciphertext = 4;                    // the 32-byte backup key
}

message BackupKeyHandoffBody {
  bytes identity_id = 1;
  uint64 roster_version = 2;  // the version the new root signed
  repeated SealedBackupKey keys = 3;
  google.protobuf.Timestamp issued_at = 4;
}

message BackupKeyHandoff {
  Signature signature = 1;  // ROOT: the root the roster at roster_version names
  bytes body = 2;           // serialized BackupKeyHandoffBody
}

// Plaintext of the identity backup (specs/identity.md 8).
message IdentityBackupBody {
  uint64 version = 1;
  SignedRoster roster = 2;
  SignedProfile profile = 3;
  repeated HostAccount accounts = 4;
  repeated PinnedKey pinned_keys = 5;
  repeated bytes blocked_identity_ids = 6;
  google.protobuf.Timestamp written_at = 7;
}
