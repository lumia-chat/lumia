// Lumia protocol: HTTP request and response bodies not covered by other
// files. Paths and methods are in docs/protocol.md "HTTP mapping"; this file
// defines the shapes those endpoints exchange.

syntax = "proto3";

package lumia.v1;

import "google/protobuf/timestamp.proto";
import "lumia/v1/chat.proto";
import "lumia/v1/common.proto";
import "lumia/v1/events.proto";
import "lumia/v1/identity.proto";

option java_multiple_files = true;
option java_package = "chat.lumia.proto.v1";
option swift_prefix = "Lumia";

// ---- Auth -----------------------------------------------------------------

message TokenPair {
  string access_token = 1;
  google.protobuf.Timestamp access_expires_at = 2;
  string refresh_token = 3;
  google.protobuf.Timestamp refresh_expires_at = 4;
  bytes session_id = 5;
}

message PasswordSignInRequest {
  string handle_or_email = 1;
  string password = 2;
  bytes device_id = 3;
  SignedRoster roster = 4;
  // Second factor when required; the first attempt returns FAILED_PRECONDITION
  // with details.mfa = "totp" | "passkey".
  string totp_code = 5;
}

message IdentityProofSignInRequest {
  IdentityProof proof = 1;
}

// POST /auth/totp/enroll: a pending secret, enabled by the first valid code
// at POST /auth/totp/confirm. RFC 6238, SHA-1, 30 seconds, 6 digits.
message TotpEnrollResponse {
  string secret = 1;       // base32, for manual entry
  string otpauth_uri = 2;  // for a QR code
}

message TotpConfirmRequest { string code = 1; }

message CreateAccountRequest {
  string handle = 1;
  string email = 2;      // optional on identity-proof creation
  string password = 3;   // optional on identity-proof creation
  IdentityProof proof = 4;
  SignedProfile profile = 5;
  // Invite that led here, if any; grants the membership on success.
  string invite_code = 6;
}

message ChallengeRequest {
  ChallengePurpose purpose = 1;
}

message ChallengeResponse {
  // Serialized IdentityChallengeBody. Sign these bytes exactly.
  bytes challenge = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message RefreshRequest { string refresh_token = 1; }

message Session {
  bytes session_id = 1;
  bytes device_id = 2;
  string client = 3;
  string ip = 4;              // own sessions only
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp last_seen_at = 6;
  bool current = 7;
}

message ListSessionsResponse { repeated Session sessions = 1; }

// ---- Instance ---------------------------------------------------------------

// GET /api/v1/instance — unauthenticated. The trust card (architecture 6.1).
message InstanceInfo {
  string host = 1;
  string operator_name = 2;
  string operator_url = 3;
  string terms_url = 4;
  string privacy_url = 5;
  string software_version = 6;
  bool identity_proof_sign_in_enabled = 7;
  bool identity_proof_create_enabled = 8;
  bool open_registration = 9;
  bool turn_configured = 10;
  bool push_relay_enabled = 11;
  // Reaction registry.
  repeated ReactionDefinition reactions = 12;
  uint64 recovery_generation = 13;
  // Web Push (RFC 8292): the instance's VAPID public key, uncompressed
  // P-256 point, base64url without padding. Empty when Web Push is off.
  string web_push_public_key = 14;
  // Magic-link sign-in (architecture 6.3): on when the instance can send mail.
  bool magic_link_enabled = 15;
  // OIDC sign-in (architecture 6.3): the provider's name for the button, such
  // as "Sign in with Okta"; empty when the instance has no provider. The flow
  // is GET /auth/oidc/start?return={url}, which ends at {url}?magic={token}.
  string oidc_name = 16;
}

// POST /auth/sign-in/magic-link — public, 202 whether or not the address
// has an account: the mail carries a link `https://{host}/sign-in?magic=…`
// and the same token as a code to paste.
message MagicLinkRequest {
  string email = 1;
}

// POST /auth/sign-in/magic-link/complete — the token from the mail, once,
// within its lifetime; answers like a password sign-in.
message MagicLinkCompleteRequest {
  string token = 1;
  bytes device_id = 2;
}

// POST /auth/handoff — a one-time sign-in token for the caller's own
// account, completed as a magic-link token is: for a native app that signs
// in through the instance's web page (a passkey, say) and takes the token
// back by its return URL, or hands its own session to that page. Fifteen
// minutes, once.
message HandoffResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// ---- Passkeys (WebAuthn, architecture 6.3) ---------------------------------
// The ceremonies carry the browser's own JSON: the options the instance
// makes (PublicKeyCredentialCreationOptions or RequestOptions, binary
// fields base64url) and the credential the browser answers with
// (PublicKeyCredential.toJSON()). A challenge is kept by the instance for
// five minutes, single use, and named by its id.

// POST /auth/passkey/register/start (signed in) and
// POST /auth/passkey/assert/start (public) both answer with this.
message PasskeyChallenge {
  string challenge_id = 1;
  string options_json = 2;
}

// POST /auth/passkey/register/finish (signed in) → 204.
message PasskeyRegisterFinishRequest {
  string challenge_id = 1;
  string credential_json = 2;
  string label = 3;
}

// POST /auth/passkey/assert/start — the account's passkeys go into
// allowCredentials when a handle is given; a discoverable passkey needs none.
message PasskeyAssertStartRequest {
  string handle_or_email = 1;
}

// POST /auth/passkey/assert/finish → TokenPair.
message PasskeyAssertFinishRequest {
  string challenge_id = 1;
  string credential_json = 2;
  bytes device_id = 3;
}

message Passkey {
  string passkey_id = 1;
  string label = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp last_used_at = 4;
}

// GET /auth/passkeys (signed in); DELETE /auth/passkeys/{passkey_id} → 204.
message ListPasskeysResponse {
  repeated Passkey passkeys = 1;
}

// ---- Push (architecture 15.5, docs/specs/deployment.md) --------------------

enum PushKind {
  PUSH_KIND_UNSPECIFIED = 0;
  WEB_PUSH = 1;       // RFC 8030/8291/8292, served by the instance itself
  UNIFIED_PUSH = 2;   // a POST to the distributor's endpoint, served by the instance itself
  RELAY_APNS = 3;     // through the relay, with the device's APNs token
  RELAY_FCM = 4;      // through the relay, with the device's FCM token
}

// PUT /push/subscription — one per (device, kind); replaces the previous.
// The instance pushes content-free notifications ("New message") for
// personal DMs and mentions to devices with no live session.
message PushSubscription {
  PushKind kind = 1;
  // WEB_PUSH and UNIFIED_PUSH: the push service URL. RELAY_*: the device token.
  string endpoint = 2;
  // WEB_PUSH: the subscription's keys, base64url without padding.
  // UNIFIED_PUSH: the same keys when the distributor gave them (RFC 8291
  // over the endpoint); without them the notice is posted as plain JSON.
  string p256dh = 3;
  string auth = 4;
}

// DELETE /push/subscription?kind= — removes this device's subscription of that kind.

message ReactionDefinition {
  string key = 1;
  string label = 2;
  string icon_url = 3;
}

// ---- Servers, channels, members ------------------------------------------

message ListServersResponse { repeated Server servers = 1; repeated Member memberships = 2; }

message CreateServerRequest { string name = 1; }

message ListChannelsResponse { repeated Channel channels = 1; }

message CreateChannelRequest {
  bytes server_id = 1;
  ChannelKind kind = 2;
  string name = 3;
  string topic = 4;
  repeated Overwrite overwrites = 5;
  // For DM kinds.
  repeated bytes participant_account_ids = 6;
}

// Personal DM creation. The server enforces the uniqueness constraint on the
// sorted identity pair and returns the existing channel on conflict
// (architecture 6.4).
message OpenPersonalDmRequest {
  repeated bytes participant_account_ids = 1;
}

message OpenPersonalDmResponse {
  Channel channel = 1;
  bool existed = 2;
}

message ListMembersRequest {
  bytes server_id = 1;
  PageRequest page = 2;
  string query = 3;  // prefix search on handle and nickname
}

message ListMembersResponse {
  repeated Member members = 1;
  repeated Account accounts = 2;
  PageResponse page = 3;
}

message UpdateMemberRequest {
  bytes server_id = 1;
  bytes account_id = 2;
  repeated bytes role_ids = 3;
  string nickname = 4;
  // Promote a guest.
  MembershipKind kind = 5;
  google.protobuf.Timestamp expires_at = 6;
}

message ListRolesResponse { repeated Role roles = 1; }

message UpsertRoleRequest { Role role = 1; }

// ---- Events, messages, snapshots -------------------------------------------

// GET /channels/{id}/events?after=&limit=  — gap fill and scrollback forward.
message ListEventsRequest {
  bytes channel_id = 1;
  uint64 after_seq = 2;
  uint64 before_seq = 3;  // exclusive; 0 = head
  uint32 limit = 4;       // 1..200
}

message ListEventsResponse {
  repeated Event events = 1;
  uint64 last_seq = 2;
  // True when after_seq is below the oldest served event; client must take
  // the snapshot path for anything older.
  bool truncated_before = 3;
}

// GET /channels/{id}/snapshot — current materialized state plus the seq it
// is valid at. Subsequent events are fetched with after_seq = seq.
message ChannelSnapshot {
  Channel channel = 1;
  uint64 seq = 2;
  // Most recent messages, newest last. Older via ListMessages.
  repeated Message messages = 3;
  repeated Message pinned = 4;
  // For PERSONAL_* channels: the recent encrypted events instead of messages.
  repeated Event encrypted_events = 5;
}

message ListMessagesRequest {
  bytes channel_id = 1;
  // Scrollback: messages with seq strictly below this. 0 = head.
  uint64 before_seq = 2;
  uint32 limit = 3;
  // Thread view: only replies to this root.
  bytes parent_id = 4;
}

message ListMessagesResponse {
  repeated Message messages = 1;
  bool has_more = 2;
}

message AccountSnapshot {
  Account account = 1;
  uint64 seq = 2;
  repeated Server servers = 3;
  repeated Member memberships = 4;
  repeated Channel channels = 5;
  repeated DmRequest pending_requests = 6;
  repeated FriendshipUpdated friendships = 7;
  SignedRoster roster = 8;
  repeated bytes blocked_identity_ids = 9;
}

message ListAccountEventsRequest {
  uint64 after_seq = 1;
  uint32 limit = 2;
}

message ListAccountEventsResponse {
  repeated AccountEvent events = 1;
  uint64 last_seq = 2;
  bool truncated_before = 3;
}

// ---- Uploads ----------------------------------------------------------------

// POST /uploads: metadata first, bytes second (PUT to upload_url).
message CreateUploadRequest {
  bytes channel_id = 1;   // determines whose plan pays (architecture 16)
  string filename = 2;
  string media_type = 3;
  uint64 size_bytes = 4;
  // Personal DMs: the client has already encrypted; the server treats bytes
  // as opaque and skips processing.
  bool client_encrypted = 5;
}

message CreateUploadResponse {
  bytes attachment_id = 1;
  string upload_url = 2;
  google.protobuf.Timestamp upload_expires_at = 3;
}

// ---- Search -----------------------------------------------------------------

message SearchRequest {
  string query = 1;
  bytes server_id = 2;     // empty: all servers the caller is in
  bytes channel_id = 3;
  bytes from_account_id = 4;
  PageRequest page = 5;
}

message SearchResponse {
  repeated Message messages = 1;
  PageResponse page = 2;
}

// ---- Friends, requests, blocks ---------------------------------------------

message SendDmRequestRequest { bytes to_account_id = 1; }
message RespondDmRequestRequest {
  bytes request_id = 1;
  DmRequestState response = 2;  // ACCEPTED, DECLINED or BLOCKED
}

message FriendRequestRequest { bytes account_id = 1; }
message ListFriendsResponse { repeated Account friends = 1; repeated FriendshipUpdated states = 2; }

message UpdateBlockListRequest {
  // Full replacement, pushed from the client's identity-held list
  // (architecture 6.4).
  repeated bytes blocked_identity_ids = 1;
}

// ---- Identity and devices -------------------------------------------------

message PublishRosterRequest { SignedRoster roster = 1; }

// POST /identity/backup-key-handoff: the rotating device hands the new backup key
// to the identity's other devices through their account logs (specs/identity.md 4.5).
message PublishBackupKeyHandoffRequest { BackupKeyHandoff handoff = 1; }

message RevokeDeviceRequest {
  // New roster with the device in `revoked`.
  SignedRoster roster = 1;
  // Required in addition to the roster signature (architecture 5.1):
  // from POST /auth/reauth.
  string reauth_token = 2;
}

message GetRosterResponse { SignedRoster roster = 1; }

// POST /auth/reauth: a fresh credential proof for the current account.
message ReauthRequest {
  oneof credential {
    string password = 1;
    string totp_code = 2;
    // WebAuthn assertion JSON, from the ceremony started at
    // POST /auth/passkey/assert/start.
    string passkey_assertion = 3;
  }
}

message ReauthResponse {
  // Five minutes, single purpose, bound to this session.
  string reauth_token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// POST /identity/link-bundles: an existing device uploads the encrypted
// bundle for a device being added (specs/identity.md 6).
message CreateLinkBundleRequest {
  // XChaCha20-Poly1305 over a serialized LinkBundleBody, keyed by
  // X25519(existing device ephemeral, LinkRequest.ephemeral_public_key).
  bytes ciphertext = 1;
  // The existing device's ephemeral X25519 public key, for the new device
  // to derive the shared key.
  bytes sender_ephemeral_public_key = 2;
  bytes nonce = 3;
  // Device being added; bound so the bundle cannot be fetched for another.
  bytes device_id = 4;
}

message CreateLinkBundleResponse {
  // Eight characters, Crockford base32, shown to the user to type into the
  // new device. Single use, ten minutes.
  string code = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// GET /identity/link-bundles/{code}?device_id= — public, single use.
message GetLinkBundleResponse {
  bytes ciphertext = 1;
  bytes sender_ephemeral_public_key = 2;
  bytes nonce = 3;
  string host = 4;
}

// PUT /identity/backup — versioned, last-writer-wins by version.
message PutIdentityBackupRequest {
  uint64 version = 1;
  // XChaCha20-Poly1305 over a serialized IdentityBackupBody under the backup key.
  bytes ciphertext = 2;
  bytes nonce = 3;
}

message GetIdentityBackupResponse {
  uint64 version = 1;
  bytes ciphertext = 2;
  bytes nonce = 3;
}

// MLS delivery-service endpoints.
message PublishKeyPackagesRequest {
  // KeyPackage messages (RFC 9420) in TLS presentation format. Replaces
  // nothing: the instance adds these to the device's pool.
  repeated bytes key_packages = 1;
  // A KeyPackage with the last_resort extension, handed out only when the
  // pool is empty and never deleted on claim. Replaces the previous one.
  bytes last_resort_key_package = 2;
}

message ClaimKeyPackageRequest {
  bytes account_id = 1;
  bytes device_id = 2;   // empty: one per authorized device
}

message ClaimKeyPackageResponse {
  message Claimed { bytes device_id = 1; bytes key_package = 2; }
  repeated Claimed key_packages = 1;
}

message PublishGroupInfoRequest {
  bytes channel_id = 1;
  bytes group_info = 2;  // for external commits on recovery (architecture 11.3)
  // The epoch the GroupInfo describes. The instance keeps the newest per
  // conversation by this number; it never parses `group_info`.
  uint64 epoch = 3;
}

// GET /mls/group-info/{channel_id}
message GetGroupInfoResponse {
  bytes group_info = 1;
  uint64 epoch = 2;
}

// ---- Invites ----------------------------------------------------------------

message Invite {
  string code = 1;
  bytes server_id = 2;
  bytes channel_id = 3;         // connected-channel invite
  bytes created_by = 4;
  google.protobuf.Timestamp expires_at = 5;
  uint32 max_uses = 6;
  uint32 uses = 7;
  // Joiners become guests (connected channels, contractors).
  bool as_guest = 8;
  google.protobuf.Timestamp guest_expires_at = 9;
}

message CreateInviteRequest {
  bytes server_id = 1;
  bytes channel_id = 2;
  google.protobuf.Timestamp expires_at = 3;
  uint32 max_uses = 4;
  bool as_guest = 5;
  uint32 guest_days = 6;
}

// GET /invites/{code} — unauthenticated. What the trust card shows before
// the user agrees to join (architecture 6.1).
message InvitePreview {
  Server server = 1;
  Channel channel = 2;
  uint32 member_count = 3;
  bool as_guest = 4;
  InstanceInfo instance = 5;
}

// GET /servers/{server_id}/invites — the server's invites, newest first,
// for a member with CREATE_INVITES.
message ListInvitesResponse {
  repeated Invite invites = 1;
}
